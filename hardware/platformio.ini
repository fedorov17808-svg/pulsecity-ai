; PulseCity AI — PlatformIO Configuration for ESP32 Field Nodes
; Target Board: Espressif ESP32 DevKit v1 / ESP32-WROOM-32D

[platformio]
default_envs = esp32dev
src_dir = .

[env:esp32dev]
platform = espressif32 @ ^6.5.0
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 921600

; Compiler flags for production performance and security
build_flags = 
    -D CORE_DEBUG_LEVEL=2
    -D ARDUINO_RUNNING_CORE=1

; Required Embedded Libraries
lib_deps =
    adafruit/DHT sensor library @ ^1.4.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    bblanchon/ArduinoJson @ ^6.21.3
